name: Build AimCarrom APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode project archive
        run: |
          base64 -d project.zip.b64 > project.zip
          mkdir source
          unzip -q project.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: source/AimCarrom_Studio_Redesign
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AimCarrom-debug-apk
          path: source/AimCarrom_Studio_Redesign/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
